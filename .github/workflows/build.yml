# Vaporust build for Windows: 64-bit (x64) and 32-bit (x86).
# - on every push and pull request: both builds and the tests (x64);
# - on a tag like v0.2.0-alpha: the archives are attached to a DRAFT release on GitHub
#   (the author publishes it by hand after checking).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Default permissions are read-only; only the release job (the draft release) needs write access.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.90.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      # aws-lc (HTTPS encryption) is built from source for 32-bit: NASM and C11 are needed.
      - name: NASM for the 32-bit build
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "AWS_LC_SYS_C_STD=11" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CFLAGS_i686_pc_windows_msvc=/std:c11" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            # Errors as one run annotation (visible without logging in to GitHub).
            $lines = $log | ForEach-Object { "$_" } |
              Where-Object { $_ -match '^\s*error|NASM|panicked|fatal error|error C\d|LNK\d|failed to run|thread .main.' } |
              Select-Object -First 60
            "::error::$($lines -join '%0A')"
            exit 1
          }

      - name: Tests
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          cargo test --release --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            # Failed tests and reasons as an annotation (visible without logging in to GitHub).
            $lines = $log | ForEach-Object { "$_" } |
              Where-Object { $_ -match 'FAILED|panicked|assertion|left:|right:|^error|failures:' } |
              Select-Object -First 60
            "::error::$($lines -join '%0A')"
            exit 1
          }

      - name: Aurelia tests
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          # Only the library (Vaporust does not use the Aurelia command-line program). Skipped: the checks
          # of the Vulkan shader cache: a Linux feature that does not apply on Windows.
          cargo test --release --locked --lib --manifest-path vendor/aurelia/Cargo.toml --target-dir target/aurelia `
            -- --skip launch::shaders --skip precache_shaders 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            $lines = $log | ForEach-Object { "$_" } |
              Where-Object { $_ -match 'FAILED|panicked|assertion|left:|right:|^error|failures:' } |
              Select-Object -First 60
            "::error::$($lines -join '%0A')"
            exit 1
          }

      - name: Archive
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "Vaporust-$v-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vaporust.exe", README.md, README.ru.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$name.zip" -Force
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash | Out-File "$name.zip.sha256" -Encoding ascii
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaporust-${{ matrix.arch }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  release:
    # A draft release with both archives - only for v* tags.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # draft release
      id-token: write # provenance attestation of the archives
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      # Provenance attestation: anyone can verify that the archive was built here from this code
      # (gh attestation verify <archive> --repo felixsmtnk/Vaporust).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          prerelease: true
          files: out/*
