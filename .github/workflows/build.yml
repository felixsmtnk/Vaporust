# Сборка Vaporust для Windows: 64 бит (x64) и 32 бит (x86).
# - при каждом push и pull request: сборка обеих версий и тесты (x64);
# - при метке вида v0.2.0-alpha: архивы прикладываются к ЧЕРНОВИКУ релиза на GitHub
#   (публикует его автор вручную после проверки).
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Права по умолчанию - только чтение; запись нужна лишь заданию release (черновик релиза).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.90.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      # aws-lc (шифрование HTTPS) для 32 бит собирается из исходников: нужны NASM и C11.
      - name: NASM для 32-битной сборки
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "AWS_LC_SYS_C_STD=11" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CFLAGS_i686_pc_windows_msvc=/std:c11" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Сборка
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          cargo build --release --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            # Ошибки - одной аннотацией запуска (их видно и без входа в GitHub).
            $lines = $log | ForEach-Object { "$_" } |
              Where-Object { $_ -match '^\s*error|NASM|panicked|fatal error|error C\d|LNK\d|failed to run|thread .main.' } |
              Select-Object -First 60
            "::error::$($lines -join '%0A')"
            exit 1
          }

      - name: Тесты
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          cargo test --release --locked --target ${{ matrix.target }} 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            # Упавшие тесты и причины - аннотацией (видно и без входа в GitHub).
            $lines = $log | ForEach-Object { "$_" } |
              Where-Object { $_ -match 'FAILED|panicked|assertion|left:|right:|^error|failures:' } |
              Select-Object -First 60
            "::error::$($lines -join '%0A')"
            exit 1
          }

      - name: Тесты Aurelia
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:CARGO_TERM_COLOR = "never"
          # Только библиотека (Vaporust не использует консольную программу Aurelia). Пропущены проверки
          # кэша шейдеров Vulkan: это функция Linux, на Windows она не применяется.
          cargo test --release --locked --lib --manifest-path vendor/aurelia/Cargo.toml --target-dir target/aurelia `
            -- --skip launch::shaders --skip precache_shaders 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) {
            $lines = $log | ForEach-Object { "$_" } |
              Where-Object { $_ -match 'FAILED|panicked|assertion|left:|right:|^error|failures:' } |
              Select-Object -First 60
            "::error::$($lines -join '%0A')"
            exit 1
          }

      - name: Архив
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "Vaporust-$v-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vaporust.exe", README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$name.zip" -Force
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash | Out-File "$name.zip.sha256" -Encoding ascii
          "ZIP=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vaporust-${{ matrix.arch }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256

  release:
    # Черновик релиза с обоими архивами - только для меток v*.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # черновик релиза
      id-token: write # подпись происхождения архивов
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      # Подпись происхождения: любой может проверить, что архив собран здесь из этого кода
      # (gh attestation verify <архив> --repo felixsmtnk/Vaporust).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: true
          files: out/*
