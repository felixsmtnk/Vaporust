[package]
name = "vaporust"
version = "0.8.2-alpha"
edition = "2021"
description = "A lightweight Steam client and launcher for Windows (Rust + egui), built on Aurelia"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
# CRC32 for non-Steam game shortcut ids in shortcuts.vdf (the same version as in Aurelia).
crc32fast = "1.5"
zip = "2.2.2"
sha2 = "0.10"
serde_json = "1"
anyhow = "1" # Aurelia error type (to tell "no network" from "login refused")
# Native window handle (taskbar flashing and the tray).
raw-window-handle = "0.6"
# Notification area (tray) icon.
tray-icon = { version = "0.21", default-features = false }
# Images, emoticons and stickers in chat: loading and decoding.
egui_extras = { version = "0.29", default-features = false, features = ["file", "image", "gif"] }
# Image from the clipboard on Ctrl+V (the same version as inside egui).
arboard = "3"
# Downloads covers missing from the Steam cache (the same version as inside egui_extras).
ehttp = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
aurelia = { package = "aurelia-steam", path = "vendor/aurelia" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.15", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
steam-vent-chat = { package = "aurelia-steam-vent-chat", version = "0.8.0" }
tokio-stream = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_System_Memory", "Win32_Security", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Media_Multimedia"] }

[build-dependencies]
# Exe icon and version info (a Windows resource generated in build.rs).
embed-resource = "2"

[dev-dependencies]
# Only for live protocol tests (the same versions as in Aurelia).
steam-vent = { package = "aurelia-steam-vent", version = "0.7.2" }
steam-vent-proto = "=0.5.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
