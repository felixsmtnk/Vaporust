[package]
name = "vaporust"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Лёгкий клиент-лаунчер Steam для Windows (Rust + egui), построенный на Aurelia"
license = "GPL-3.0-or-later"

[dependencies]
eframe = "0.29"
# Картинки, смайлики и стикеры в чате: загрузка по http и декодирование.
egui_extras = { version = "0.29", default-features = false, features = ["http", "image", "gif"] }
# Картинка из буфера обмена по Ctrl+V (та же версия, что внутри egui).
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
aurelia = { package = "aurelia-steam", path = "vendor/aurelia" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
qrcode = { version = "0.14", default-features = false }
rfd = { version = "0.15", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
steam-vent-chat = { package = "aurelia-steam-vent-chat", version = "0.8.0" }
tokio-stream = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
